[project]
name = "inpage-search"
version = "0.1.0"
description = "In-page QA search: highlight a question's answer inside a web page with one listwise jina-reranker-v3.5 call"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Han Xiao" }]
keywords = ["reranker", "listwise", "retrieval", "mlx", "apple-silicon", "jina"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "mlx>=0.20",
  "mlx-lm>=0.20",
  "numpy>=1.24",
  "safetensors>=0.4",
  "tokenizers>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/hanxiao/jina-reranker-v3.5-in-page-search"
Model = "https://huggingface.co/jinaai/jina-reranker-v3.5-mlx"
Paper = "https://arxiv.org/abs/2607.18152"

[project.scripts]
inpage = "inpage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inpage"]
